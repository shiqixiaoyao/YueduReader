name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  IPA_PATH: Payload/YueduReader.unsigned.ipa

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcrun xcodebuild -resolvePackageDependencies -project YueduReader.xcodeproj -scheme YueduReader -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Build without code signing
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/xcodebuild.log"
          summary="$RUNNER_TEMP/xcodebuild-summary.txt"
          set +e
          xcrun xcodebuild -project YueduReader.xcodeproj -scheme YueduReader -destination 'generic/platform=iOS' -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          {
            echo '## xcodebuild diagnostics'; echo; echo "xcodebuild exit code: $status"; echo
            echo '### Compiler errors and warnings'; grep -E '(^|[[:space:]])(error|warning):' "$log" || true; echo
            echo '### Last 200 log lines'; tail -n 200 "$log"
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild-summary.txt
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name 'YueduReader.app' -print -quit)
          test -n "$app"
          ipa_dir="$RUNNER_TEMP/ipa"
          rm -rf "$ipa_dir"
          mkdir -p "$ipa_dir/Payload" "$GITHUB_WORKSPACE/Payload"
          cp -R "$app" "$ipa_dir/Payload/YueduReader.app"
          (cd "$ipa_dir" && zip -qry "$GITHUB_WORKSPACE/$IPA_PATH" Payload)
          test -f "$GITHUB_WORKSPACE/$IPA_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader.unsigned
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Create or update GitHub prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ci-latest
          name: YueduReader unsigned CI build
          body: Automated unsigned iOS IPA from the latest successful main build.
          prerelease: true
          make_latest: false
          files: ${{ env.IPA_PATH }}
          fail_on_unmatched_files: true
          overwrite_files: true
